# 如果在国内拉取镜像慢，可以配置 Docker 镜像加速：
# 1. Docker Desktop: Settings -> Docker Engine -> 添加 "registry-mirrors": ["https://<your-mirror>.mirror.aliyuncs.com"]
# 2. 或使用下面 compose 中注释掉的阿里云镜像地址

services:
  postgres:
    # 国内用户可改用：registry.cn-hangzhou.aliyuncs.com/library/postgres:16-alpine
    image: postgres:16-alpine
    container_name: xhs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xhs_ops_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # 国内用户可改用：registry.cn-hangzhou.aliyuncs.com/library/redis:7-alpine
    image: redis:7-alpine
    container_name: xhs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: xhs-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xhs_ops_agent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
